<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form - WDD 131 Dynamic Web Fundamentals">
    <meta name="author" content="Olayioye Opeyemi">
    <title>Product Review Form | WDD 131</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <!-- Product Name -->
            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- Options populated dynamically by form.js -->
                </select>
            </div>

            <!-- Overall Rating -->
            <div class="form-group">
                <label>Overall Rating</label>
                <div class="rating-group">
                    <label for="rating1">
                        <span class="star">☆</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        1
                    </label>
                    <label for="rating2">
                        <span class="star">☆☆</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        2
                    </label>
                    <label for="rating3">
                        <span class="star">☆☆☆</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        3
                    </label>
                    <label for="rating4">
                        <span class="star">☆☆☆☆</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        4
                    </label>
                    <label for="rating5">
                        <span class="star">☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        5
                    </label>
                </div>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <div class="form-group">
                <label>Useful Features (Check all that apply)</label>
                <div class="features-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="durability" name="features" value="durability">
                        <label for="durability">Durability</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="easeOfUse" name="features" value="ease-of-use">
                        <label for="easeOfUse">Ease of Use</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="performance" name="features" value="performance">
                        <label for="performance">Performance</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="design" name="features" value="design">
                        <label for="design">Design</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="value" name="features" value="value">
                        <label for="value">Value for Money</label>
                    </div>
                </div>
            </div>

            <!-- Written Review -->
            <div class="form-group">
                <label for="writtenReview">Written Review (optional)</label>
                <textarea id="writtenReview" name="writtenReview"
                    placeholder="Share your experience with this product..."></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="userName">Your Name (optional)</label>
                <input type="text" id="userName" name="userName" placeholder="Enter your name">
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Olayioye Opeyemi | WDD 131</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
